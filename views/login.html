<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading...</title>
<style>
  :root{
    --font-sans: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text',
                 'Helvetica Neue', 'Segoe UI', Roboto, Ubuntu, sans-serif;
    --ease-spring: cubic-bezier(0.32, 0.72, 0, 1);
    --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  }
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#FAF7F2;
    font-family:var(--font-sans);
    -webkit-font-smoothing:antialiased;
    letter-spacing:-0.011em;
  }
  .card{
    width:100%;
    max-width:340px;
    padding:2.3rem;
    background:#fff;
    border:1px solid rgba(0,0,0,.07);
    border-radius:18px;
    box-shadow:0 1px 2px rgba(0,0,0,.04), 0 16px 40px -12px rgba(0,0,0,.12);
  }
  h1{
    font-size:1.35rem;
    font-weight:700;
    letter-spacing:-0.02em;
    margin:0 0 1.4rem;
    color:#1E1B16;
  }
  #brand-logo-wrap{ text-align:center; }
  #brand-logo-wrap:empty{ display:none; }
  #brand-logo-wrap img{ margin-bottom:.8rem; }
  label{ display:block; font-size:.8rem; color:#5B5548; margin:.85rem 0 .3rem; letter-spacing:-0.006em; }
  input{
    width:100%;
    padding:.62rem .75rem;
    border:1px solid rgba(0,0,0,.12);
    border-radius:10px;
    font-size:.95rem;
    font-family:inherit;
    box-sizing:border-box;
    transition:border-color 180ms var(--ease-out), box-shadow 180ms var(--ease-out);
  }
  input:focus{
    outline:none;
    border-color:#1F2A44;
    box-shadow:0 0 0 3px rgba(31,42,68,.12);
  }
  button{
    width:100%;
    margin-top:1.5rem;
    padding:.68rem;
    background:#1F2A44;
    color:#fff;
    border:none;
    border-radius:10px;
    font-size:.95rem;
    font-weight:600;
    letter-spacing:-0.006em;
    cursor:pointer;
    transition:background-color 200ms var(--ease-out), transform 150ms var(--ease-spring);
  }
  button:hover{ background:#2C3A5C; }
  button:active{ transform:scale(0.97); }
  .msg{
    margin:0 0 1rem;
    padding:.6rem .8rem;
    background:#FBEAEA;
    border:1px solid #E3B8B8;
    color:#8C3A2E;
    border-radius:10px;
    font-size:.85rem;
    display:none;
  }
  @media (prefers-reduced-motion: reduce){
    *{ transition-duration:1ms !important; }
  }
</style>
</head>
<body>
  <div class="card">
    <div id="brand-logo-wrap"></div>
    <h1 id="app-title">Sign in</h1>
    <div class="msg" id="msg"></div>
    <form method="POST" action="/login">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" autocomplete="username" required autofocus>
      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>
      <button type="submit">Sign in</button>
    </form>
  </div>
  <script>
    // App name/logo come from /api/config -- see config.json to change
    // either. Supports name only, logo + name, or logo only.
    fetch('/api/config')
      .then((r) => r.json())
      .then((cfg) => {
        document.title = cfg.appName + ' - Login';

        if (cfg.logoUrl) {
          const wrap = document.getElementById('brand-logo-wrap');
          const img = document.createElement('img');
          img.src = cfg.logoUrl;
          img.alt = cfg.appName;
          img.style.maxHeight = '48px';
          img.style.maxWidth = '220px';
          wrap.appendChild(img);
        }

        const showName = !cfg.logoUrl || cfg.showNameWithLogo;
        document.getElementById('app-title').textContent = showName
          ? 'Sign in to ' + cfg.appName
          : 'Sign in';
      })
      .catch(() => {
        document.getElementById('app-title').textContent = 'Sign in';
      });

    // Reads ?reason= and shows a plain, non-specific message.
    // Deliberately never mentions an expiry date or distinguishes
    // "wrong username" from "wrong password".
    const MESSAGES = {
      'session-ended': 'You were logged out because your account was accessed from another device.',
      'expired': 'Your access is no longer active. Please contact your instructor.',
      'access-disabled': 'Your access is no longer active. Please contact your instructor.',
      'no-batch': 'Your access is no longer active. Please contact your instructor.',
      'bad-credentials': 'Incorrect username or password.'
    };
    const params = new URLSearchParams(window.location.search);
    const reason = params.get('reason');
    if (reason && MESSAGES[reason]) {
      const el = document.getElementById('msg');
      el.textContent = MESSAGES[reason];
      el.style.display = 'block';
    }
  </script>
</body>
</html>
